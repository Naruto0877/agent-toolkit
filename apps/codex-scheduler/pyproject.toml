[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-scheduler"
version = "0.1.0"
description = "Durable account-pinned local scheduling for the official Codex CLI"
requires-python = ">=3.10"
dependencies = ["cli-provider-core>=0.1.0"]

[project.scripts]
codex-scheduler = "codex_scheduler.cli:main"

[tool.setuptools.packages.find]
include = ["codex_scheduler*"]

[project.urls]
Repository = "https://github.com/Naruto0877/agent-toolkit"
Documentation = "https://github.com/Naruto0877/agent-toolkit/tree/main/apps/codex-scheduler/docs"
