name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, process, and packaging tests
        run: python -m unittest discover -s tests -v
      - name: Build portable skill
        run: python scripts/build_skill.py --output dist
      - name: Verify source installer
        run: |
          sh install.sh
          .venv/bin/codex-scheduler --version
