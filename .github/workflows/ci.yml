name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Project, provider, and tooling tests
        run: python tools/workspace.py test
      - name: Build every catalog skill
        run: python tools/skills/build.py --all --output dist
      - name: Verify application installer
        run: |
          python tools/workspace.py install codex-scheduler
          apps/codex-scheduler/.venv/bin/codex-scheduler --version

  runtime-repair:
    name: Legacy Python repair / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: legacy
        with:
          python-version: '3.9'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Legacy rejection and environment repair regression tests
        env:
          TOOLKIT_TEST_LEGACY_PYTHON: ${{ steps.legacy.outputs.python-path }}
        run: python -m unittest discover -s tools/tests -p test_runtime_installation.py -v
